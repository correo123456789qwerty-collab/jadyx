#
# Every pull request must build. A merge to main does not build again: the PR already built the
# merged result (pull_request checks out the merge commit), and Release builds main itself. Run it
# by hand (Actions -> CI -> Run workflow, on any branch) to also get a signed test appx as a 14-day
# artifact.

name: CI

on:
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:
    inputs:
      package:
        description: Also make a signed test appx
        type: boolean
        default: true
      package_version:
        description: Test package version (MAJOR.MINOR.BUILD.REVISION); empty keeps the manifest's
        type: string
        default: ""
      lto:
        description: Enable the host link-time optimization used by releases
        type: boolean
        default: true
      windows_runner:
        description: Windows compiler image (2022 provides the VS 2022 fallback)
        type: choice
        options:
          - windows-2025
          - windows-2022
        default: windows-2025

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    name: release scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: python3 tools/xbox/tests/release.py

  video:
    uses: ./.github/workflows/video.yml

  build:
    uses: ./.github/workflows/build.yml
    with:
      package: ${{ github.event_name == 'workflow_dispatch' && inputs.package }}
      package_version: ${{ github.event_name == 'workflow_dispatch' && inputs.package_version || '' }}
      lto: ${{ github.event_name == 'workflow_dispatch' && inputs.lto }}
      windows_runner: ${{ github.event_name == 'workflow_dispatch' && inputs.windows_runner || 'windows-2025' }}
    secrets: inherit
