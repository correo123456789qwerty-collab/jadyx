#
# Every pull request must build. A merge to main does not build again: the PR already built the
# merged result (pull_request checks out the merge commit), and Release builds main itself. Run it
# by hand (Actions -> CI -> Run workflow, on any branch) to also get a signed test appx as a 14-day
# artifact.

name: CI

on:
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:
    inputs:
      package:
        description: Also make a signed test appx
        type: boolean
        default: true
      package_version:
        description: Test package version (MAJOR.MINOR.BUILD.REVISION); empty keeps the manifest's
        type: string
        default: ""
      reuse_build_run:
        description: Repackage a successful CI run without compiling (empty builds current code)
        type: string
        default: ""
      inspect_cache:
        description: Inspect a saved compiler tree without building or packaging
        type: string
        default: ""
      seed_build_cache:
        description: Explicit compatible compiler-tree seed for a controlled configuration migration
        type: string
        default: ""
      lto:
        description: Enable the host link-time optimization used by releases
        type: boolean
        default: true
      windows_runner:
        description: Windows compiler image (2022 provides the VS 2022 fallback)
        type: choice
        options:
          - windows-2025
          - windows-2022
        default: windows-2025

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}${{ inputs.inspect_cache != '' && '-inspect' || '' }}
  cancel-in-progress: true

jobs:
  scripts:
    if: github.event_name != 'workflow_dispatch' || (inputs.reuse_build_run == '' && inputs.inspect_cache == '')
    name: release scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: |
          python3 tools/xbox/tests/release.py
          python3 tools/xbox/tests/incremental-build-state.py

  video:
    if: github.event_name != 'workflow_dispatch' || (inputs.reuse_build_run == '' && inputs.inspect_cache == '')
    uses: ./.github/workflows/video.yml

  build:
    if: github.event_name != 'workflow_dispatch' || (inputs.reuse_build_run == '' && inputs.inspect_cache == '')
    uses: ./.github/workflows/build.yml
    with:
      package: ${{ github.event_name == 'workflow_dispatch' && inputs.package }}
      package_version: ${{ github.event_name == 'workflow_dispatch' && inputs.package_version || '' }}
      lto: ${{ github.event_name == 'workflow_dispatch' && inputs.lto }}
      windows_runner: ${{ github.event_name == 'workflow_dispatch' && inputs.windows_runner || 'windows-2025' }}
      seed_build_cache: ${{ github.event_name == 'workflow_dispatch' && inputs.seed_build_cache || '' }}
    secrets: inherit

  repackage:
    if: github.event_name == 'workflow_dispatch' && inputs.reuse_build_run != '' && inputs.inspect_cache == ''
    uses: ./.github/workflows/repackage.yml
    with:
      source_run_id: ${{ inputs.reuse_build_run }}
      package_version: ${{ inputs.package_version }}
      windows_runner: ${{ inputs.windows_runner }}
    secrets: inherit

  inspect:
    if: github.event_name == 'workflow_dispatch' && inputs.inspect_cache != ''
    uses: ./.github/workflows/inspect-incremental-build.yml
    with:
      cache_key: ${{ inputs.inspect_cache }}
