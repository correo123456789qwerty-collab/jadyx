name: Inspect incremental build

on:
  workflow_call:
    inputs:
      cache_key:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      cache_key:
        description: Exact compiler cache key to inspect (read only)
        required: true
        type: string

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache/restore@v6
        with:
          path: build-uwp
          key: ${{ inputs.cache_key }}
          fail-on-cache-miss: true
      - shell: pwsh
        run: |
          $lines = Get-Content build-uwp/build.ninja
          $start = ($lines | Select-String '^build bin[\\/]jadyx.exe:').LineNumber
          if (!$start) { throw 'Executable rule missing' }
          $lines[$start..($start + 12)] | Where-Object { $_ -match 'FLAGS = ' }
          Get-ChildItem build-uwp/ltcg -File | Format-Table Name, Length
          Get-ChildItem build-uwp/bin -Filter '*.ipdb' | Format-Table Name, Length
